services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: conference_app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_KEY: ${APP_KEY}
      APP_DEBUG: ${APP_DEBUG:-false}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-conference_booking}
      DB_USERNAME: ${DB_USERNAME:-conference}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
      JWT_SECRET: ${JWT_SECRET}
      MAIL_MAILER: ${MAIL_MAILER:-smtp}
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS}
    volumes:
      - app_storage:/var/www/html/storage
    networks:
      - conference_network

  nginx:
    image: nginx:1.25-alpine
    container_name: conference_nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-80}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - app_storage:/var/www/html/storage:ro
    depends_on:
      - app
    networks:
      - conference_network

  mysql:
    image: mysql:8.0
    container_name: conference_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-conference_booking}
      MYSQL_USER: ${DB_USERNAME:-conference}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - conference_network

  redis:
    image: redis:7-alpine
    container_name: conference_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - conference_network

  queue:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: conference_queue
    restart: unless-stopped
    command: php artisan queue:work --queue=default,notifications --tries=3 --sleep=3 --timeout=90
    depends_on:
      - app
      - redis
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_KEY: ${APP_KEY}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-conference_booking}
      DB_USERNAME: ${DB_USERNAME:-conference}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      QUEUE_CONNECTION: redis
    volumes:
      - app_storage:/var/www/html/storage
    networks:
      - conference_network

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: conference_scheduler
    restart: unless-stopped
    command: sh -c "while true; do php artisan schedule:run; sleep 60; done"
    depends_on:
      - app
      - mysql
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_KEY: ${APP_KEY}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-conference_booking}
      DB_USERNAME: ${DB_USERNAME:-conference}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      QUEUE_CONNECTION: redis
    volumes:
      - app_storage:/var/www/html/storage
    networks:
      - conference_network

volumes:
  mysql_data:
  redis_data:
  app_storage:

networks:
  conference_network:
    driver: bridge
